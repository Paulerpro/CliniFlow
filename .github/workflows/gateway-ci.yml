name: gateway-ci

on:
  push:
    paths: ["gateway/**", ".github/workflows/gateway-ci.yml"]
  pull_request:
    paths: ["gateway/**", ".github/workflows/gateway-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/requirements.txt
      - run: pip install -r gateway/requirements.txt
      - run: python -m ruff check gateway
      # Tests use a fake model server and the committed ICD-10 table: no network, no GPU, no secrets.
      - run: python -m pytest gateway -q
