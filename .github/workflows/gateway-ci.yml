name: ci

on:
  push:
    paths: ["gateway/**", "agents/**", ".github/workflows/gateway-ci.yml"]
  pull_request:
    paths: ["gateway/**", "agents/**", ".github/workflows/gateway-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gateway/requirements.txt
            agents/requirements.txt
      - run: pip install -r agents/requirements.txt
      - run: python -m ruff check gateway agents
      # Tests use fake model servers and the committed ICD-10 table: no network, no GPU, no secrets.
      - run: python -m pytest gateway agents -q
